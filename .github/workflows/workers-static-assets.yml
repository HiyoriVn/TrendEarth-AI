name: Cloudflare Workers static-assets validation

on:
  push:
    branches:
      - main
      - fix/workers-static-assets
    paths:
      - wrangler.jsonc
      - frontend/**
      - data/processed/**
      - .github/workflows/workers-static-assets.yml
  pull_request:
    paths:
      - wrangler.jsonc
      - frontend/**
      - data/processed/**
      - .github/workflows/workers-static-assets.yml

permissions:
  contents: read

jobs:
  static-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - name: Check generated asset files and NASA JSON
        run: |
          test -f frontend/dist/index.html
          test -n "$(find frontend/dist/assets -name '*.js' -print -quit)"
          test -n "$(find frontend/dist/assets -name '*.css' -print -quit)"
          cmp data/processed/hanoi.json frontend/dist/data/hanoi.json
          cmp data/processed/can-tho.json frontend/dist/data/can-tho.json
      - name: Validate Worker deployment without publishing
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/trendearth-workers-dry-run

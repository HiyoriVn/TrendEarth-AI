name: Python data QA
on:
  push:
    paths: ['pipeline/**', 'data/**', 'tests/**', '.github/workflows/python-tests.yml']
  pull_request:
    paths: ['pipeline/**', 'data/**', 'tests/**', '.github/workflows/python-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r pipeline/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python pipeline/analyze.py --out-dir "$RUNNER_TEMP/reproduced"
